[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pathlens"
version = "0.1.0"
description = "Deterministic AD attack-path explanation prototype"
requires-python = ">=3.11"
dependencies = ["networkx>=3.2", "typer>=0.12", "rich>=13", "pydantic>=2"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
pathlens = "pathlens.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
