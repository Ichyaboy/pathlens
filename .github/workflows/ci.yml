name: Python packaging and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        run: python -m pip install uv==0.13.1
      - name: Install locked development environment and test
        run: |
          uv sync --locked --extra dev --python "$(command -v python)"
          uv run --no-sync python -m pytest -q
      - name: Build sdist and wheel from sdist
        run: uv build --python "$(command -v python)"
      - name: Verify both artifacts in separate clean environments
        run: python scripts/verify_artifacts.py --python "$(command -v python)"
